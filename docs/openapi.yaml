openapi: 3.0.3
info:
  title: AutoGenBook API
  version: 0.2.0
  description: >
    HTTP API for AutoGenBook, served by the FastAPI app in `api/main.py` and reached
    through the nginx-fronted Docker Compose stack.


    **Contract baseline, not a generated spec.** This file is hand-aligned with
    backend issues #1-#11 (milestone "Book API v1") so the frontend can generate
    DTOs (`openapi-typescript`) before every route is implemented. Issue #12 later
    replaces it with a spec exported from `api.main:create_app` (`app.openapi()`);
    from that point this file is regenerated, not hand-edited.


    Operations tagged `system` are **implemented today** (`x-status: implemented`,
    issue #1, merged). Every other operation is a **contract baseline**
    (`x-status: planned`) for a route that does not exist in `api/` yet - see the
    issue number in each operation's `x-issue` extension for the backend work that
    implements it. Schema field names, enum values and status codes below are
    transcribed directly from those issues' task lists, which are canonical; if this
    file and an issue ever disagree, the issue wins and this file is out of date.


    Precedence for any data-shape disagreement across the stack is **CLI > API >
    FE**: the Python CLI's on-disk artifacts (`book_structure.json`,
    `structure_graph.json`, `run_meta.json`) are the source of truth the API adapts
    to, and the frontend's TypeScript types are generated from this file, never
    hand-written.


    No authentication and no CORS middleware exist in the implemented service
    today; a nullable `ownerId` is reserved on `projects` for later auth work but is
    not part of the wire contract yet, so this spec intentionally omits
    `securitySchemes`.
servers:
  - url: /
    description: >
      Reached through the nginx reverse proxy (`app/nginx.conf`, `location /api/`)
      in front of the FastAPI service, which mounts every versioned route under
      `/api/v1` (`api/main.py:create_app`, `APIRouter(prefix="/api/v1")`). Legacy
      unversioned aliases `/api/health` and `/api/ready` also exist for the compose
      healthcheck but are excluded from this spec (`include_in_schema=False`).
tags:
  - name: system
    description: Implemented health/readiness endpoints (issue #1).
  - name: files
    description: >
      Implemented (issue #3). Standalone file storage (MinIO-backed); every
      other resource references files by `fileId` only.
  - name: projects
    description: Contract baseline (issue #4). Project (book) CRUD.
  - name: sources
    description: >
      Contract baseline (issue #5). Files attached to a project as RAG sources.
  - name: outline
    description: >
      Contract baseline (issue #6). Outline nodes: flat list with `parentId` is the
      canonical shape; `?format=tree` is a rendering convenience.
  - name: runs
    description: >
      Contract baseline (issues #9, #10, #11). Generation runs, SSE progress,
      artifacts, per-node regeneration and format exports.

paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check
      x-status: implemented
      description: >
        **Implemented** (`api/presentation/routers/system.py:health`). Always
        returns `ok`; does not check dependencies.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/ready:
    get:
      tags: [system]
      operationId: getReady
      summary: Readiness check (verifies Postgres connectivity)
      x-status: implemented
      description: >
        **Implemented** (`api/presentation/routers/system.py:ready`). Runs
        `SELECT 1` through the async session, then calls the object-storage
        adapter's `healthcheck()` (`api/infrastructure/storage/s3.py`).
      responses:
        "200":
          description: Database and object storage checks both succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: >
            A dependency (database or object storage) is unreachable.
            `api/core/errors.py:StorageError`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/files:
    get:
      tags: [files]
      operationId: listFiles
      summary: List uploaded/artifact files
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfFile"
    post:
      tags: [files]
      operationId: uploadFile
      summary: Upload a file
      x-status: implemented
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: File stored (key `uploads/{fileId}/{filename}`), `kind=upload`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "413":
          description: >
            Upload exceeds `MAX_UPLOAD_MB`. The partial object is deleted; no `File`
            row is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/files/{fileId}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [files]
      operationId: getFile
      summary: Get file metadata
      x-status: implemented
      responses:
        "200":
          description: File metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "404":
          description: File not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [files]
      operationId: deleteFile
      summary: Delete a file
      x-status: implemented
      responses:
        "204":
          description: File deleted.
        "404":
          description: File not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >
            File is still referenced by a project source (issue #5) or a run
            artifact (issue #10).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/files/{fileId}/content:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [files]
      operationId: getFileContent
      summary: Download file bytes
      x-status: implemented
      description: >
        Streamed response with `Content-Disposition: attachment`,
        `Content-Length` and `ETag: "<sha256>"`.
      responses:
        "200":
          description: File bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List projects
      x-status: planned
      x-issue: 4
      description: Sorted by `updatedAt` descending.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of project summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfProjectSummary"
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project
      x-status: planned
      x-issue: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "422":
          description: >
            Validation failed (e.g. `totalPagesBudget` outside 5-2000,
            `maxOutlineLevels`/`equationFrequencyLevel` outside 1-5).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: getProject
      summary: Get a project
      x-status: planned
      x-issue: 4
      responses:
        "200":
          description: Full project, including embedded `sources` and `outline` (tree).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Update project metadata
      x-status: planned
      x-issue: 4
      description: >
        Metadata fields only. `sources`/`outline` keys are rejected with 422 - they
        have their own endpoints (issues #5, #6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed, or `sources`/`outline` present in the body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete a project
      x-status: planned
      x-issue: 4
      description: Cascades to sources, outline nodes and runs via foreign keys.
      responses:
        "204":
          description: Project deleted.
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/projects/{projectId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      operationId: duplicateProject
      summary: Duplicate a project
      x-status: planned
      x-issue: 4
      description: >
        Title suffixed " (Copy)". Copies sources by reference (same `fileId`s) and
        deep-copies outline nodes with new ids.
      responses:
        "201":
          description: New, duplicated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Source project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/projects/{projectId}/sources:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [sources]
      operationId: listSources
      summary: List a project's attached sources
      x-status: planned
      x-issue: 5
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfSource"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [sources]
      operationId: addSource
      summary: Attach an already-uploaded file to a project as a source
      x-status: planned
      x-issue: 5
      description: >
        There is no indexing at upload time - the CLI builds its BM25 index per run
        (issue #9), so a new source starts `status: ready` with `chunksCount: null`,
        not the draft contract's `202 indexing`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceCreate"
      responses:
        "201":
          description: Source attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Project or file not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: This file is already attached to the project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >
            File is not KB-eligible (`kbEligible: false` - extension outside
            `.pdf .docx .pptx .md .txt`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/projects/{projectId}/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/SourceId"
    get:
      tags: [sources]
      operationId: getSource
      summary: Get a source
      x-status: planned
      x-issue: 5
      responses:
        "200":
          description: Source, including `chunksCount`/`status` once indexed by a run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Project or source not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags: [sources]
      operationId: updateSource
      summary: Update a source's bibliographic metadata
      x-status: planned
      x-issue: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceUpdate"
      responses:
        "200":
          description: Updated source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Project or source not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [sources]
      operationId: removeSource
      summary: Detach a source from the project
      x-status: planned
      x-issue: 5
      description: Removes the attachment; the underlying file is not deleted.
      responses:
        "204":
          description: Source detached.
        "404":
          description: Project or source not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/projects/{projectId}/outline:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [outline]
      operationId: listOutlineNodes
      summary: List outline nodes, flat or nested
      x-status: planned
      x-issue: 6
      parameters:
        - $ref: "#/components/parameters/OutlineFormat"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: >
            `items` is the flat node list (default `format=flat`) or the
            root-level nested nodes (`format=tree`, each with `children`); `total`
            is always the flat node count.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PageOfOutlineNode"
                  - $ref: "#/components/schemas/PageOfOutlineNodeTree"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags: [outline]
      operationId: replaceOutline
      summary: Replace the whole outline tree
      x-status: planned
      x-issue: 6
      description: >
        Deletes and recreates every node from a nested tree without ids (e.g. wizard
        step 2, or a client-side reorder). Returns the new flat list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutlineTreeReplace"
      responses:
        "200":
          description: New outline, flat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfOutlineNode"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: A node's depth exceeds `project.maxOutlineLevels`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [outline]
      operationId: createOutlineNode
      summary: Create one outline node
      x-status: planned
      x-issue: 6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutlineNodeCreate"
      responses:
        "201":
          description: New outline node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutlineNode"
        "404":
          description: Project (or parent node) not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Depth would exceed `project.maxOutlineLevels`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/projects/{projectId}/outline/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [outline]
      operationId: getOutlineNode
      summary: Get an outline node
      x-status: planned
      x-issue: 6
      description: Includes full `contentMarkdown`/`contentLatex`/`ragCitations`.
      responses:
        "200":
          description: Outline node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutlineNode"
        "404":
          description: Project or node not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags: [outline]
      operationId: updateOutlineNode
      summary: Update an outline node
      x-status: planned
      x-issue: 6
      description: >
        Consolidates rename/content-edit/math-level/equation-density/budget/move
        into one generic PATCH, since they all mutate the same row. Editing
        `contentMarkdown` recomputes `actualWords` server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutlineNodeUpdate"
      responses:
        "200":
          description: Updated outline node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutlineNode"
        "404":
          description: Project or node not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >
            A server-derived field (`level`, `sectionNumber`, `cliKey`,
            `actualWords`) was present in the body, or the requested `parentId`
            move would exceed `project.maxOutlineLevels`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [outline]
      operationId: deleteOutlineNode
      summary: Delete an outline node (cascades to descendants)
      x-status: planned
      x-issue: 6
      responses:
        "204":
          description: Node and its subtree deleted.
        "404":
          description: Project or node not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/projects/{projectId}/outline/{nodeId}/regenerate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NodeId"
    post:
      tags: [outline]
      operationId: regenerateOutlineNode
      summary: Regenerate one node's content, reusing the project's last run
      x-status: planned
      x-issue: 11
      description: >
        Reuses `project.lastRunId`'s work directory and the CLI's `--resume`
        semantics; does not re-run structural planning. Sets the node `status` to
        `drafting` immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRequest"
      responses:
        "202":
          description: Regeneration run queued, kind `regenerate_section`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Project or node not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >
            No successful prior run to resume from, its work directory is gone, or
            the project already has an active run.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/projects/{projectId}/runs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [runs]
      operationId: listRuns
      summary: List a project's runs
      x-status: planned
      x-issue: 9
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfRun"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [runs]
      operationId: createRun
      summary: Start a full generation run
      x-status: planned
      x-issue: 9
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunOptions"
      responses:
        "202":
          description: Run queued, kind `full`. Picked up by a worker within one poll interval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Project not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The project already has a queued or running run.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: getRun
      summary: Get a run
      x-status: planned
      x-issue: 9
      responses:
        "200":
          description: Run, including `resumable` (false once its work dir has been reaped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel a queued or running run
      x-status: planned
      x-issue: 9
      description: >
        A queued run is cancelled immediately; a running one has
        `cancelRequested` set and its subprocess is terminated by the worker.
      responses:
        "202":
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Run is already in a terminal state (`succeeded`/`failed`/`cancelled`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: listRunEvents
      summary: Poll accumulated run events
      x-status: planned
      x-issue: 9
      description: Polling fallback for clients that don't use the SSE stream.
      parameters:
        - name: afterSeq
          in: query
          required: false
          description: Only return events with `seq` greater than this value.
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of run events, ordered by `seq` ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfRunEvent"
        "404":
          description: Run not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/runs/{runId}/events/stream:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: streamRunEvents
      summary: Server-Sent Events stream of run progress
      x-status: planned
      x-issue: 9
      description: >
        SSE chosen over WebSocket because `app/nginx.conf`'s `location /api/` block
        has no `Upgrade`/`Connection: upgrade` headers, while SSE works over plain
        HTTP/1.1 unchanged. Event `id:` is the `RunEvent.seq`; the server honours a
        `Last-Event-ID` request header to resume a dropped connection. Event names:
        `log` (a `RunEvent` with `level`/`message`), `stage` (pipeline stage
        change), `section` (a leaf section finished), `done` (terminal, stream
        closes after). OpenAPI has no way to type per-event-name payloads; each
        event's `data:` is JSON shaped like `RunEvent` (see `RunEvent` below and
        `docs/WEB_API_REFERENCE.md` for the full per-event field list). The server
        polls `run_events` every second.
      responses:
        "200":
          description: Event stream, open until the run reaches a terminal state.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Run not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/runs/{runId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: listRunArtifacts
      summary: List files produced by a run
      x-status: planned
      x-issue: 10
      description: Download each artifact via `GET /api/v1/files/{fileId}/content`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of run artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfRunArtifact"
        "404":
          description: Run not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/runs/{runId}/exports:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runs]
      operationId: exportRun
      summary: Build a LaTeX/PDF export from a finished run, without regenerating content
      x-status: planned
      x-issue: 11
      description: >
        Reuses the base run's work directory with `--resume --export-tex`; produces
        `tex`/`pdf` artifacts (issue #10) without touching any section content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Export run queued, kind `export`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Base run is not `succeeded`, its work dir is gone, or the project has an active run.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1-200 (default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
