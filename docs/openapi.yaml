openapi: 3.1.0
info:
  title: AutoGenBook API
  description: HTTP API for AutoGenBook, served by this FastAPI app and reached through
    the nginx-fronted Docker Compose stack. Every route is mounted under /api/v1;
    there is no authentication and no CORS middleware. Error responses use RFC 9457
    problem details (application/problem+json); list endpoints return a {items, total,
    limit, offset} page envelope.
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - system
      summary: Health
      operationId: system-health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response System-Health
  /api/v1/ready:
    get:
      tags:
      - system
      summary: Ready
      operationId: system-ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response System-Ready
  /api/v1/files:
    post:
      tags:
      - files
      summary: Upload File
      operationId: files-upload_file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_files-upload_file'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - files
      summary: List Files
      operationId: files-list_files
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_File_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/files/{file_id}:
    get:
      tags:
      - files
      summary: Get File
      operationId: files-get_file
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - files
      summary: Delete File
