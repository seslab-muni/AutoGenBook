components:
  schemas:
    ArtifactKind:
      type: string
      enum:
      - markdown
      - tex
      - pdf
      - structure_graph
      - book_structure
      - section
      - section_review
      - kb_sources
      - run_meta
      - llm_usage
      - audit_report
      - log
      - bib
      - other
      title: ArtifactKind
    Body_files-upload_file:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_files-upload_file
    ExportRequestIn:
      properties:
        format:
          type: string
          enum:
          - latex
          - pdf
          title: Format
      additionalProperties: false
      type: object
      required:
      - format
