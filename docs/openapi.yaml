          type: string
          pattern: ^(txt|json)$
          default: txt
          title: Format
      - name: includeOutline
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Includeoutline
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
