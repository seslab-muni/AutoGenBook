        enum: [flat, tree]
        default: flat

  schemas:
    Problem:
      type: object
      description: >
        RFC 9457 problem details, `Content-Type: application/problem+json`
        (`api/core/errors.py`).
      properties:
        type:
          type: string
          description: Always `"about:blank"` today (no per-error-type documentation URIs yet).
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          nullable: true
        instance:
          type: string
          description: The request path that produced the error.
      required: [type, title, status, instance]

    HealthStatus:
      type: object
      description: Response of the implemented `GET /api/v1/health`.
      properties:
        status:
          type: string
          enum: [ok]
      required: [status]

    ReadyStatus:
      type: object
      description: Response of the implemented `GET /api/v1/ready` on success.
      properties:
        status:
          type: string
          enum: [ready]
      required: [status]

    PageOfFile:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/File"
          required: [items]
    PageOfProjectSummary:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ProjectSummary"
          required: [items]
    PageOfSource:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Source"
          required: [items]
    PageOfOutlineNode:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OutlineNode"
          required: [items]
    PageOfOutlineNodeTree:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OutlineNodeTree"
          required: [items]
    PageOfRun:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Run"
          required: [items]
    PageOfRunEvent:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RunEvent"
          required: [items]
    PageOfRunArtifact:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RunArtifact"
          required: [items]

    PageBase:
      type: object
      description: >
        Common envelope fields (`api/presentation/schemas/common.py:Page`); each
