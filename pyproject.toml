[project]
name = "autogenbook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Patrik Procházka", email = "me@patrikprochazka.com" }
]
requires-python = ">=3.12"
dependencies = [
    # engine/ (epic #158); the old CLI's dependencies stay in requirements.txt
    "openai>=1.30.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy, optional engine extras, imported lazily.
local-embeddings = ["sentence-transformers>=3.0"]
tts-local = ["TTS>=0.22", "pydub>=0.25"]

[project.scripts]
autogenbook = "autogenbook:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests/api"]
asyncio_mode = "auto"
pythonpath = ["."]
