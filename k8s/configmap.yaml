apiVersion: v1
kind: ConfigMap
metadata:
  name: autogenbook-config
data:
  POSTGRES_DB: "autogenbook"
  POSTGRES_USER: "autogenbook"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_ACCESS_KEY: "autogenbook"
  S3_BUCKET: "autogenbook"
  RUNS_DIR: "/app/runs"
  KB_EXTRACT_CACHE_DIR: "/app/kb_cache"
  MAX_UPLOAD_MB: "200"
  MAX_QUEUED_RUNS_PER_PROJECT: "5"
  # Per-user LLM keys. LLM_KEY_ENCRYPTION_KEY (a Secret key, optional) turns the feature on;
  # `required` needs it. 4 = the e-INFRA gateway's parallel-request limit per key.
  LLM_KEY_POLICY: "optional"
  LLM_USER_KEY_CONCURRENCY: "4"
  WORKER_CONCURRENCY: "1"
  WORKER_POLL_INTERVAL_S: "2"
  WORKER_STALE_S: "300"
  RUNS_RETENTION_DAYS: "30"
  # Wall-clock budget per CLI run (SIGKILL after). 12 h: a 350-page book is ~77 leaf sections
  # at ~6 min each on glm-5.3 (e-INFRA); the previous 6 h killed such runs at section ~58
  # and discarded the work (October 2026 incident).
  CLI_RUN_TIMEOUT_S: "43200"
  CLI_CANCEL_GRACE_S: "15"
  # Per-request LLM timeout and app-level retries, read by both engines. Non-streaming
  # completions of 8-9k tokens take 250-300 s on glm-5.3 (~35 tok/s), so 300 s timed out on
  # every long section and the retries (x3 SDK-internal in the old engine) replayed the same
  # request for an hour before the run failed. 900 s fits those calls; 1 retry bounds a true
  # stall to 2x the timeout (new engine) or 6x (old engine) instead of 4x / 12x.
  OPENROUTER_REQUEST_TIMEOUT_S: "900"
  OPENROUTER_MAX_RETRIES: "1"
  AUTOGENBOOK_KB_OCR: "1"
  AUTOGENBOOK_KB_OCR_LANG: "eng"
  MCP_GATEWAY_ENABLE: "0"
  # The rewritten engine (engine/, epic #158): run_engine.py instead of the old main.py.
  CLI_ENTRYPOINT: "run_engine.py"
  # e-INFRA gateway. The base URL also lives in the Secret (AUTOGENBOOK_LLM_BASE_URL, same
  # value); the key is the Secret's AUTOGENBOOK_LLM_API_KEY.
  AUTOGENBOOK_LLM_BASE_URL: "https://llm.ai.e-infra.cz/v1/"
  # qwen3.8-flash-next replaced glm-5.3 (October 2026): glm ran at ~35 tok/s, which made a
  # 350-page book a 12 h run. qwen3.8-flash-next is a thinking model - at its default effort
  # it spends ~2000 hidden reasoning tokens per call (35 s for a 300-word answer); with
  # reasoning_effort "none" it answers the same prompt in 9 s with no reasoning tokens, and
  # "low" sits in between (~130 reasoning tokens, 15 s). The engine accepts "none".
  AUTOGENBOOK_LLM_MODEL: "qwen3.8-flash-next"
  AUTOGENBOOK_LLM_MINI_MODEL: "deepseek-v4.1-flash"
  AUTOGENBOOK_LLM_REASONING_EFFORT: "none"
  AUTOGENBOOK_FORCE_MINI_MODEL: "0"
  # Parallel LLM requests per run (engine default 4). Prod's five workers share one gateway
  # key with a ~4 parallel-request limit (LLM_USER_KEY_CONCURRENCY above), so one per run;
  # users who store their own key get LLM_USER_KEY_CONCURRENCY instead.
  AUTOGENBOOK_CONCURRENCY: "1"
