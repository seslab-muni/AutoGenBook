apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume - never run two Postgres pods at once
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: db
        image: postgres:16-alpine
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        envFrom:
        - configMapRef: {name: autogenbook-config}
        - secretRef: {name: autogenbook-secrets}
        env:
        # The block-storage PVC's filesystem creates a `lost+found` directory at its root,
        # which makes initdb refuse to initialize the mount point directly ("directory ...
        # exists but is not empty"). Point PGDATA at a subdirectory of the mount instead - the
        # standard workaround documented by the official postgres image for exactly this case.
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports:
        - containerPort: 5432
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        readinessProbe:
          exec: {command: ["pg_isready", "-U", "autogenbook", "-d", "autogenbook"]}
          periodSeconds: 5
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: postgres-data}}
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector: {app: db}
  ports: [{port: 5432, targetPort: 5432}]
