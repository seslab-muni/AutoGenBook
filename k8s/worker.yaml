apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # Issue #134 phase 3: 5 single-slot pods (WORKER_CONCURRENCY=1, from
  # autogenbook-config) instead of 1 pod with 5 slots - a KB build/LuaLaTeX
  # pass big enough to OOM one slot used to take all 5 down with it, a
  # rolling deploy drained (and briefly ran zero generation capacity for)
  # every in-flight run at once, and one crashed pod meant one run lost,
  # not five. Per-pod resources are unchanged; 5 replicas at the existing
  # `requests`/`limits` below means the Deployment's aggregate footprint is
  # now 2.5 CPU / 5 Gi requested, 10 CPU / 20 Gi at the limit - size the
  # node pool accordingly.
  replicas: 5
  # Pinned explicitly (issue #134 review) rather than left at the default
  # `RollingUpdate` 25%/25% - that default would let a redeploy briefly run
  # up to 7 pods (`ceil(5 * 1.25)`), pushing the aggregate footprint to
  # 3.5 CPU / 7 Gi requested against the 2.5 CPU / 5 Gi documented above,
  # which a namespace `ResourceQuota` sized to the documented figure would
  # reject (`kubectl describe limitrange`/`resourcequota` per
  # `docs/DEPLOY_GUIDE.md`). `maxUnavailable: 1, maxSurge: 0` never exceeds
  # 5 pods and replaces them one at a time - the literal "drains one pod at
  # a time" this Deployment's own comment above claims.
  strategy:
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: worker
        image: cerit.io/conerzyo/autogenbook:c168935
        command: ["python", "-m", "api.worker"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        envFrom:
        - configMapRef: {name: autogenbook-config}
        - secretRef: {name: autogenbook-secrets}
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: "2", memory: 4Gi}
        volumeMounts:
        - {name: runs, mountPath: /app/runs}
        - {name: kb-cache, mountPath: /app/kb_cache}
      volumes:
      - {name: runs, persistentVolumeClaim: {claimName: runs-data}}
      - {name: kb-cache, persistentVolumeClaim: {claimName: kb-extract-cache}}
