apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-08-29T01-40-52Z
        args: ["server", "/data", "--console-address", ":9001"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        env:
        - name: MINIO_ROOT_USER
          valueFrom: {configMapKeyRef: {name: autogenbook-config, key: S3_ACCESS_KEY}}
        - name: MINIO_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: autogenbook-secrets, key: S3_SECRET_KEY}}
        ports: [{containerPort: 9000}, {containerPort: 9001}]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
        readinessProbe:
          httpGet: {path: /minio/health/live, port: 9000}
          periodSeconds: 5
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: minio-data}}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: {app: minio}
  ports: [{name: api, port: 9000, targetPort: 9000}, {name: console, port: 9001, targetPort: 9001}]
