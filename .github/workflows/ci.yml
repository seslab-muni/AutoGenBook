name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly e2e run (issue #23) - the `e2e` job below also runs on every push to `main`, this
    # is only so main gets checked even on a day with no pushes. UTC, well outside any timezone's
    # working hours.
    - cron: "17 3 * * *"

jobs:
  python:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autogenbook
          POSTGRES_PASSWORD: autogenbook
          POSTGRES_DB: autogenbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autogenbook -d autogenbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://autogenbook:autogenbook@localhost:5432/autogenbook
      DATABASE_URL: postgresql+psycopg://autogenbook:autogenbook@localhost:5432/autogenbook
      # No default in api/core/settings.py (issue #96) - CI needs its own value, unrelated to any real deployment secret.
      AUTH_JWT_SECRET: ci-test-secret-do-not-use-in-production-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r api/requirements-dev.txt

      - name: Apply Alembic migrations and check for model/migration drift
        # Runs first, against the service container's pristine database:
        # `tests/api/conftest.py`'s `session_factory` fixture does its own
        # `drop_all`/`create_all` per test (see that file), which would
        # otherwise leave `pytest tests/api` having already created every
        # table and enum type through SQLAlchemy - colliding with Alembic's
        # own `CREATE TYPE`/`CREATE TABLE` statements (e.g. `DuplicateObject:
        # type "file_kind" already exists`) if it ran second.
        run: |
          alembic -c api/alembic.ini upgrade head
          alembic -c api/alembic.ini check

      - name: Run api/ test suite (pytest, against Postgres)
        run: pytest tests/api

      - name: Run CLI unit test suite
        # `tests/` isn't a package (no `__init__.py`), so bare `python -m
        # unittest` performs top-level discovery differently across Python
        # versions and finds nothing here - point discovery at the package
        # explicitly instead. Covers the same tests CLAUDE.md's documented
        # `python -m unittest` is meant to run.
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Prompt pack completeness check
        run: python -m autogenbook.smoke_prompts

      - name: Check exported OpenAPI schema is up to date
        run: |
          python scripts/export_openapi.py --out /tmp/openapi.yaml
          diff -u docs/openapi.yaml /tmp/openapi.yaml

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API types are up to date
        # `src/api/schema.gen.ts` is generated from `../docs/openapi.yaml` (`pnpm gen:api`,
        # `app/README.md`'s API client layer section) and committed - a PR that edits the spec
        # without regenerating types would otherwise merge silently out of sync with it.
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.gen.ts

      - name: Lint (eslint + tsc --noEmit)
        run: pnpm lint

      - name: Run test suite (vitest)
        run: pnpm test:ci

      # `pnpm lint`'s `tsc --noEmit` runs outside project-reference/build mode (the root
      # tsconfig.json's `files: []` isn't invoked the way `tsc -b` is) and has been shown to miss
      # real type errors `pnpm build`'s `tsc -b` catches (issue #98) - kept as its own step rather
      # than assumed covered by lint.
      - name: Build (tsc -b + vite build)
        run: pnpm build

      - name: Check bundle-size budget
        # Reads `dist/bundle-stats.json` (`rollup-plugin-visualizer`, wired in `vite.config.ts`)
        # and `dist/.vite/manifest.json`, both produced by the `pnpm build` step above.
        run: pnpm check:bundle-budget

      - name: Build the app's Docker image
        run: docker build .

  # End-to-end/a11y smoke against the real Docker Compose stack (issue #23) - not run on every
  # PR: building every image plus the stack's own startup easily takes several minutes on top of
  # the `app`/`python` jobs above, so this only runs on `main` (catch a regression right after it
  # merges) and nightly (catch drift on a day with no pushes) - see the workflow-level `schedule`
  # trigger above.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (CLI subprocess swapped for tests/api/fake_cli.py)
        run: |
          echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)" > .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --build

      - name: Seed a login
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T \
            -e AUTOGENBOOK_USER_PASSWORD="${E2E_USER_PASSWORD}" api \
            python -m api.scripts.users create --email "${E2E_USER_EMAIL}" --name "E2E User"
        env:
          E2E_USER_EMAIL: e2e@example.com
          E2E_USER_PASSWORD: e2e-ci-password-not-a-secret

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's browser
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the e2e/a11y suite
        working-directory: app
        run: pnpm e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          E2E_USER_EMAIL: e2e@example.com
          E2E_USER_PASSWORD: e2e-ci-password-not-a-secret

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
