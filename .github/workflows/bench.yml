# Engine benchmarks, on demand only (never on push or pull_request): the always-on `ci.yml`
# deselects every test marked `bench` so it stays well inside the 15-minute job limit.
#
# Start it from the Actions tab ("Run workflow") or with
#   gh workflow run bench.yml                      # harness checks + retrieval eval, no key, no network
#   gh workflow run bench.yml -f engine=compare    # old vs new engine on a real endpoint (needs secrets)
#
# A real run needs the repository secrets AUTOGENBOOK_LLM_BASE_URL, AUTOGENBOOK_LLM_API_KEY,
# AUTOGENBOOK_LLM_MODEL (and optionally AUTOGENBOOK_LLM_MINI_MODEL, AUTOGENBOOK_JUDGE_MODEL).
# The report (`report.md`, `report.json`, work dirs, stdout logs) is uploaded as an artifact.
name: bench

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "fake: harness + retrieval eval only. new / old / compare: a real benchmark run on the configured LLM endpoint."
        type: choice
        default: fake
        options: [fake, new, old, compare]
      input:
        description: "Benchmark input directory"
        type: choice
        default: input/bench/en_book
        options: [input/bench/en_book, input/bench/cs_book, input/bench/en_paper, input/bench/en_presentation]
      concurrency:
        description: "New-engine concurrency level(s), comma-separated (e.g. 4 or 1,4)"
        default: "4"
      judge:
        description: "Run the blind pairwise judge (compare only)"
        type: boolean
        default: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r api/requirements-dev.txt
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Benchmark harness checks and retrieval eval (fake CLI, no key)
        # The `bench`-marked tests: scripts/bench_engines.py end to end against tests/api/fake_cli.py,
        # scripts/bench_retrieval.py on the old BM25 baseline, and "new BM25 is not worse than the
        # old KB" on every benchmark question set.
        run: pytest tests/engine --bench -m bench --timeout=900 -v

      - name: Retrieval benchmark report (no model)
        run: python scripts/bench_retrieval.py --retriever old,bm25-lemma --k 6 --out output/bench/retrieval

      - name: Engine benchmark on the real endpoint
        if: ${{ inputs.engine != 'fake' }}
        env:
          AUTOGENBOOK_LLM_BASE_URL: ${{ secrets.AUTOGENBOOK_LLM_BASE_URL }}
          AUTOGENBOOK_LLM_API_KEY: ${{ secrets.AUTOGENBOOK_LLM_API_KEY }}
          AUTOGENBOOK_LLM_MODEL: ${{ secrets.AUTOGENBOOK_LLM_MODEL }}
          AUTOGENBOOK_LLM_MINI_MODEL: ${{ secrets.AUTOGENBOOK_LLM_MINI_MODEL }}
          AUTOGENBOOK_JUDGE_MODEL: ${{ secrets.AUTOGENBOOK_JUDGE_MODEL }}
        run: |
          test -n "$AUTOGENBOOK_LLM_BASE_URL" -a -n "$AUTOGENBOOK_LLM_API_KEY" -a -n "$AUTOGENBOOK_LLM_MODEL" \
            || { echo "::error::AUTOGENBOOK_LLM_BASE_URL / _API_KEY / _MODEL secrets are not set"; exit 1; }
          if [ "${{ inputs.engine }}" = "compare" ]; then
            python scripts/bench_engines.py --compare --input "${{ inputs.input }}" \
              --concurrency "${{ inputs.concurrency }}" ${{ inputs.judge && '--judge' || '' }} --out output/bench/engines
          else
            python scripts/bench_engines.py --engine "${{ inputs.engine }}" --input "${{ inputs.input }}" \
              --concurrency "${{ inputs.concurrency }}" --out output/bench/engines
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ inputs.engine }}-${{ github.run_number }}
          path: output/bench/
          if-no-files-found: ignore
