[alembic]
script_location = %(here)s/infrastructure/db/alembic
prepend_sys_path = %(here)s/..
version_path_separator = os

# sqlalchemy.url is intentionally left unset here; api/infrastructure/db/alembic/env.py
# fills it in from Settings.database_url (i.e. the DATABASE_URL env var) at run time.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
