x-cli-env: &cli-env
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AUTOGENBOOK_LLM_BASE_URL: ${AUTOGENBOOK_LLM_BASE_URL:-}
  AUTOGENBOOK_LLM_API_KEY: ${AUTOGENBOOK_LLM_API_KEY:-}
  AUTOGENBOOK_LLM_MODEL: ${AUTOGENBOOK_LLM_MODEL:-}
  AUTOGENBOOK_LLM_MINI_MODEL: ${AUTOGENBOOK_LLM_MINI_MODEL:-}
  AUTOGENBOOK_FORCE_MINI_MODEL: ${AUTOGENBOOK_FORCE_MINI_MODEL:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  AUTOGENBOOK_KB_OCR: ${AUTOGENBOOK_KB_OCR:-1}
  AUTOGENBOOK_KB_OCR_LANG: ${AUTOGENBOOK_KB_OCR_LANG:-eng}
  # OpenRouter client tuning (openrouter_llm.py) and outbound proxy settings -
  # needed for the CLI subprocess (run inside the worker/api container) to
  # reach the LLM/Tavily endpoints from behind a corporate proxy. Forwarded
  # here and then on into the CLI subprocess by `book_command.py`'s
  # `ENV_ALLOWLIST` (see the hotfix commits for AUTOGENBOOK_LLM_MODEL/
  # AUTOGENBOOK_KB_OCR for the established pattern).
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
  OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
  OPENROUTER_X_TITLE: ${OPENROUTER_X_TITLE:-}
  OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-}
  OPENROUTER_PRICING_DISABLE: ${OPENROUTER_PRICING_DISABLE:-}
  OPENROUTER_PRICING_FUZZY: ${OPENROUTER_PRICING_FUZZY:-}
  OPENROUTER_PRICING_TIMEOUT: ${OPENROUTER_PRICING_TIMEOUT:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  SSL_CERT_FILE: ${SSL_CERT_FILE:-}

x-app-env: &app-env
  <<: *cli-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autogenbook}:${POSTGRES_PASSWORD:-autogenbook}@db:5432/${POSTGRES_DB:-autogenbook}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-autogenbook}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-change-this-secret}
  S3_BUCKET: ${S3_BUCKET:-autogenbook}
  RUNS_DIR: /app/runs
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
  KB_EXTRACT_CACHE_DIR: /app/kb_cache

services:
  web:
    build:
      context: ./app
    environment:
      # Consumed by `app/nginx.conf.template`'s `client_max_body_size`
      # (issue #47) - keep this equal to the API's own `MAX_UPLOAD_MB` above,
      # or nginx will reject uploads the API would otherwise accept (or the
      # reverse, uploads nginx admits that the API's own limit still 413s).
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    ports:
      # `/api/v1` requires a login session for everything but `/auth/login`
      # and the health/ready probes (issue #96); still bound to localhost by
      # default so the stack isn't reachable from the network out of the box
      # unless you deliberately set WEB_BIND_HOST=0.0.0.0 (and, for a real
      # deployment, put this behind TLS - `AUTH_COOKIE_SECURE=1`'s `Secure`
      # cookie attribute needs it).
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

  # One-shot migration runner (same pattern as `minio-init` below): applies
  # `alembic upgrade head` and exits, so `api`/`worker` can depend on it
  # completing successfully instead of racing each other to migrate (or, in
  # the worker's case, polling a DB whose tables don't exist yet and logging
  # a traceback every `WORKER_POLL_INTERVAL_S` until `api` finishes them).
  migrate:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autogenbook}:${POSTGRES_PASSWORD:-autogenbook}@db:5432/${POSTGRES_DB:-autogenbook}
      # Not used by the migration itself - `alembic/env.py` builds its DB URL
      # through `api.core.settings.get_settings()`, and `AUTH_JWT_SECRET` is
      # now a required field on that same `Settings` object (issue #96), so
      # constructing it at all fails without this even here.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env (openssl rand -hex 32) before starting the stack}
      # Migration 0017's backfill (api/infrastructure/db/alembic/versions/
      # 0017_projects_llm_model.py) reads this to seed every existing
      # project's `llm_model` column - without it here, every pre-existing
      # project silently backfills to the migration's hardcoded fallback
      # instead of whatever model this deployment was actually configured
      # with (issue #128 review).
      AUTOGENBOOK_LLM_MODEL: ${AUTOGENBOOK_LLM_MODEL:-}
    command: alembic -c api/alembic.ini upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
    environment:
      <<: *app-env
      # Not used to bind anything here - forwarded only so the startup
      # default-credentials check (api/core/settings.py) can tell whether
      # `web` (the only container actually exposed to the host, see its
      # `ports:` comment below) is reachable beyond localhost.
      WEB_BIND_HOST: ${WEB_BIND_HOST:-127.0.0.1}
      # Auth (issue #96). `AUTH_JWT_SECRET` has no default (`:?...` fails `docker compose up`
      # outright, loudly, instead of starting an API container that would reject every login) -
      # `worker` also requires it (see its own `environment:` block) since both processes
      # construct the same `Settings`, even though only `api` actually verifies session cookies
      # with it; `AUTH_TOKEN_TTL_H`/`AUTH_COOKIE_*` below are `api`-only; the worker never speaks
      # HTTP, so it has no cookie to issue or verify.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env (openssl rand -hex 32) before starting the stack}
      AUTH_TOKEN_TTL_H: ${AUTH_TOKEN_TTL_H:-24}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-autogenbook_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-1}
      # Issue #134: how many `queued` runs one project may hold at once (`RunService`'s
      # `queue_admission_blocker`) - `api`-only, the worker never admits runs itself.
      MAX_QUEUED_RUNS_PER_PROJECT: ${MAX_QUEUED_RUNS_PER_PROJECT:-5}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    volumes:
      - runs_data:/app/runs
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - frontend
      - backend

  worker:
    build:
      context: .
    command: python -m api.worker
    # Long enough for `GenerationService`'s SIGTERM -> (CLI_CANCEL_GRACE_S)
    # -> SIGKILL teardown of an in-flight CLI subprocess plus the DB write
    # that releases the run back to the queue to actually finish before
    # compose gives up and SIGKILLs this container itself (issue #52) -
    # SIGKILLing the worker mid-teardown is exactly what used to leave a
    # run stuck `running` until `WORKER_STALE_S`.
    stop_grace_period: 30s
    environment:
      <<: *app-env
      # `api.core.settings.Settings` (shared by `api` and `worker`, since both construct it via
      # `get_settings()`) requires this with no default - without it the worker crashes on
      # startup before it can poll for runs at all. The worker itself never speaks HTTP/issues
      # cookies, so this is only here to satisfy that shared, required field, not because the
      # worker verifies sessions.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env (openssl rand -hex 32) before starting the stack}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_POLL_INTERVAL_S: ${WORKER_POLL_INTERVAL_S:-2}
      WORKER_STALE_S: ${WORKER_STALE_S:-300}
      RUNS_RETENTION_DAYS: ${RUNS_RETENTION_DAYS:-30}
      CLI_RUN_TIMEOUT_S: ${CLI_RUN_TIMEOUT_S:-21600}
      CLI_CANCEL_GRACE_S: ${CLI_CANCEL_GRACE_S:-15}
      REWRITE_AUTHOR_LINE: ${REWRITE_AUTHOR_LINE:-1}
    volumes:
      - runs_data:/app/runs
      # Content-hash-keyed cache of extracted document text (rag_kb.py), deliberately
      # separate from runs_data: it's shared across every project/run rather than
      # scoped to one run's work dir, and must survive `sweep_stale_work_dirs`
      # deleting individual runs.
      - kb_extract_cache:/app/kb_cache
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - frontend
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autogenbook}
      POSTGRES_USER: ${POSTGRES_USER:-autogenbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autogenbook}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-autogenbook}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-this-secret}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-autogenbook}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-this-secret}
      S3_BUCKET: ${S3_BUCKET:-autogenbook}
    entrypoint: ["sh", "-c"]
    command:
      - >
        mc alias set local "$$S3_ENDPOINT_URL" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    networks:
      - backend

volumes:
  postgres_data:
  minio_data:
  runs_data:
  kb_extract_cache:

networks:
  frontend:
  backend:
    internal: true
