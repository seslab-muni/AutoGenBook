x-cli-env: &cli-env
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AUTOGENBOOK_LLM_BASE_URL: ${AUTOGENBOOK_LLM_BASE_URL:-}
  AUTOGENBOOK_LLM_API_KEY: ${AUTOGENBOOK_LLM_API_KEY:-}
  AUTOGENBOOK_FORCE_MINI_MODEL: ${AUTOGENBOOK_FORCE_MINI_MODEL:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  MCP_GATEWAY_ENABLE: ${MCP_GATEWAY_ENABLE:-0}

x-app-env: &app-env
  <<: *cli-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autogenbook}:${POSTGRES_PASSWORD:-autogenbook}@db:5432/${POSTGRES_DB:-autogenbook}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-autogenbook}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-change-this-secret}
  S3_BUCKET: ${S3_BUCKET:-autogenbook}
  RUNS_DIR: /app/runs
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
  KB_EXTRACT_CACHE_DIR: /app/kb_cache

services:
  web:
    build:
      context: ./app
    environment:
      # Consumed by `app/nginx.conf.template`'s `client_max_body_size`
      # (issue #47) - keep this equal to the API's own `MAX_UPLOAD_MB` above,
      # or nginx will reject uploads the API would otherwise accept (or the
      # reverse, uploads nginx admits that the API's own limit still 413s).
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    ports:
      # `/api/v1` has no authentication (issue #50) - bind to localhost by
      # default so the stack isn't reachable from the network out of the
      # box. Set WEB_BIND_HOST=0.0.0.0 (and put a real auth/proxy layer in
      # front) to expose it beyond the host.
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

  api:
    build:
      context: .
    environment:
      <<: *app-env
    command: sh -c "alembic -c api/alembic.ini upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    volumes:
      - runs_data:/app/runs
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - frontend
      - backend

  worker:
    build:
      context: .
    command: python -m api.worker
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_POLL_INTERVAL_S: ${WORKER_POLL_INTERVAL_S:-2}
      WORKER_STALE_S: ${WORKER_STALE_S:-300}
      RUNS_RETENTION_DAYS: ${RUNS_RETENTION_DAYS:-30}
      CLI_RUN_TIMEOUT_S: ${CLI_RUN_TIMEOUT_S:-21600}
      CLI_CANCEL_GRACE_S: ${CLI_CANCEL_GRACE_S:-15}
    volumes:
      - runs_data:/app/runs
      # Content-hash-keyed cache of extracted document text (rag_kb.py), deliberately
      # separate from runs_data: it's shared across every project/run rather than
      # scoped to one run's work dir, and must survive `sweep_stale_work_dirs`
      # deleting individual runs.
      - kb_extract_cache:/app/kb_cache
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - frontend
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autogenbook}
      POSTGRES_USER: ${POSTGRES_USER:-autogenbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autogenbook}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-autogenbook}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-this-secret}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-autogenbook}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-this-secret}
      S3_BUCKET: ${S3_BUCKET:-autogenbook}
    entrypoint: ["sh", "-c"]
    command:
      - >
        mc alias set local "$$S3_ENDPOINT_URL" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    networks:
      - backend

volumes:
  postgres_data:
  minio_data:
  runs_data:
  kb_extract_cache:

networks:
  frontend:
  backend:
    internal: true
