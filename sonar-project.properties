# Scope: the web API (api/) and frontend (app/src) only. The core CLI
# (autogenbook/, main.py, prompts/, etc.) is kept as a mergeable fork of
# upstream pkonas/AutoGenBook and is intentionally not scanned here.
sonar.projectKey=autogenbook
sonar.projectName=AutoGenBook
sonar.sourceEncoding=UTF-8

sonar.sources=api,app/src
sonar.tests=tests/api,app/src
sonar.test.inclusions=tests/api/**,app/src/**/*.test.ts,app/src/**/*.test.tsx

sonar.exclusions=\
  app/_reference/**,\
  app/src/routeTree.gen.ts,\
  app/src/api/schema.gen.ts,\
  api/infrastructure/db/alembic/versions/**

sonar.coverage.exclusions=\
  app/_reference/**,\
  app/src/routeTree.gen.ts,\
  app/src/api/schema.gen.ts,\
  app/src/components/ui/**,\
  api/infrastructure/db/alembic/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  tests/api/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=api/coverage.xml
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
sonar.typescript.tsconfigPath=app/tsconfig.app.json
